# Python lint and format for backend/, scripts/, and .claude/hooks/.
line-length = 120
target-version = "py311"
extend-exclude = ["data", "frontend", ".venv"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() defaults are the framework idiom
    "UP042", # StrEnum changes str(member); enums.py keeps (str, Enum) on purpose
]
